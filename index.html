<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arg_quarky's Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
        }
        
        .intro-screen {
            text-align: center;
            color: white;
        }
        
        h1 {
            font-size: 4rem;
            margin-bottom: 2rem;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
            animation: fadeIn 1s ease-in;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="intro-screen">
        <h1>Arg_quarky's Page</h1>
    </div>
</body>
</html>
<style>
    .button-container {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 1rem;
    }
    
    button {
        padding: 10px 20px;
        font-size: 1rem;
        background-color: rgba(255, 255, 255, 0.2);
        color: white;
        border: 2px solid white;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s;
    }
    
    button:hover {
        background-color: rgba(255, 255, 255, 0.3);
    }
</style>

<div class="button-container">
    <button onclick="redirectToMiivaGunner()">MiivaGunner ToS</button>
     <button onclick="redirectToGames()">Games</button>
</div>

<script>
    function redirectToMiivaGunner() {
        window.location.href = '/MiivaGunner/';
    }

    function redirectToGames() {
        window.location.href = '/games/';
    }
</script>
